set -g default-terminal "tmux-256color"
# true color, so nvims colorscheme renders correctly
set -as terminal-features ",xterm-256color:RGB"
# vim mode switch delat
set -s escape-time 0
set -g base-index 1

# larger logs scrollbac
set -g history-limit 50000

# nvim relies on focus events for autoread
set -g focus-events on

# renumber windows on close instead of leaving gaps
set -g renumber-windows on

# refresh interval lowered from 15s to 5s
set -g status-interval 5

# see which pane is running what, without switching to it
set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_current_command}"

# quick popus for a one-off check without disturbing the pane layout
bind-key g display-popup -E -w 80% -h 80% "btop"
bind-key P display-popup -E -w 80% -h 80% "perf top"
# optional -- i like C-a not C-b (pure preference)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key a last-window

# vi key movement for copy/pasta mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# <WHERE YOUR TMUX CONF GOES> = XDG_CONFIG_HOME/tmux/tmux.conff
# <WHERE YOUR TMUX CONF GOES> = ~/.tmux.conf

bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# vim movements
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# --- TPM (tmux plugin manager), self-bootstrapping like lazy.nvim does ---
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
# save/restore session layout across reboots; continuum auto-saves every
# 15 min so a multi-hour build or profiling sweep survives a crash/reboot
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

